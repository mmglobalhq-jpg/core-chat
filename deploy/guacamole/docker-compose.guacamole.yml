# Apache Guacamole desktop gateway — SCAFFOLD ONLY (NOT part of the live stack).
#
# Nothing here runs until you explicitly bring it up, and it never touches the
# active core-* / cloudflared stack or the public tunnel.
#
# Prereqs (in the master /home/mmglobal/projects/.env):
#   RDP_HOST, RDP_USERNAME, RDP_PASSWORD   -> the target desktop (RDP)
#   GUAC_ADMIN_PASSWORD                    -> the Guacamole UI login password
# plus a reachable RDP/VNC server at RDP_HOST.
#
# Bring it up (localhost-only; see README.md for the full flow + tunnel wiring):
#   set -a; . /home/mmglobal/projects/.env; set +a
#   ./render-config.sh
#   docker compose -f docker-compose.guacamole.yml up -d
#
# Secrets stay OUT of source: connection params reference env-rendered
# guacamole-home/user-mapping.xml (gitignored); this file holds no secrets.

# Bounded container logs. Docker's json-file driver defaults to UNBOUNDED, so a
# long-running container writes until the disk fills — silent for months, then the
# host wedges and everything on it stops at once, including the backups and the
# watchdog meant to notice. 10 of 12 containers were unbounded when this was added.
#
# Set per service rather than as a daemon-wide default because log-driver options
# are NOT reloadable via SIGHUP: a daemon default would need a dockerd restart,
# whereas this applies on the next ordinary recreate.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  guacd:
    logging: *default-logging
    image: guacamole/guacd:1.5.5
    container_name: guacd
    restart: unless-stopped
    networks:
      - guac-net

  guacamole:
    logging: *default-logging
    image: guacamole/guacamole:1.5.5
    container_name: guacamole
    restart: unless-stopped
    depends_on:
      - guacd
    environment:
      GUACD_HOSTNAME: guacd
      GUACD_PORT: "4822"
      GUACAMOLE_HOME: /etc/guacamole
      # Deploy the webapp as ROOT.war so it serves at / instead of /guacamole/.
      # desktop.mmglobal.us hits the bare domain; without this Tomcat 404s at root.
      WEBAPP_CONTEXT: ROOT
    # user-mapping.xml holds cleartext credentials and is mode 0640 owned
    # mmglobal:mmglobal. The image runs as uid 1001 (guacamole), which could only
    # read it when the file was world-readable (0644) - the exposure flagged as
    # R-01/C-11 in the security audit. Granting the mmglobal gid as a supplementary
    # group lets the container read it WITHOUT world-readable and WITHOUT running as
    # root. Mirrors the dig gateway's group_add: ["10001"] pattern.
    # Do NOT "fix" a permission error here by chmod 644 or by chowning the file.
    group_add:
      - "1000"
    volumes:
      # Rendered config: user-mapping.xml (secrets, gitignored) + guacamole.properties.
      - ./guacamole-home:/etc/guacamole:ro
    ports:
      # Internal bind ONLY — never 0.0.0.0. Public access is via the Cloudflare
      # Tunnel + Access (see README), configured separately when going live.
      - "127.0.0.1:8080:8080"
    networks:
      - guac-net

networks:
  guac-net:
    driver: bridge
